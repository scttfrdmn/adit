# SPDX-License-Identifier: Apache-2.0
#
# The single definition of "does this commit pass?". Called by ci.yml; any later
# release workflow calls the same file so a tag runs exactly what a PR runs.
#
# Rust builds against the NIXL stub API (nixl-sys `stub-api`): CI has no NIXL, no EFA
# and no GPU. Tests that need them are #[ignore]d and run on instances via `make test-hw`.
name: gate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  rust:
    name: rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: toolchain
        if: hashFiles('Cargo.toml') != ''
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version
      - name: cargo fmt
        if: hashFiles('Cargo.toml') != ''
        run: cargo fmt --all --check
      - name: cargo clippy
        if: hashFiles('Cargo.toml') != ''
        run: cargo clippy --workspace --all-targets --features stub-api -- -D warnings
      - name: cargo test
        if: hashFiles('Cargo.toml') != ''
        run: cargo test --workspace --features stub-api

  go:
    name: go (vet, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        if: hashFiles('go.mod') != ''
        with:
          go-version-file: go.mod
          check-latest: true
      - name: go vet
        if: hashFiles('go.mod') != ''
        run: go vet ./...
      - name: golangci-lint
        if: hashFiles('go.mod') != ''
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          # Must track the Go in go.mod (go1.27 export data needs >= v2.14).
          version: v2.15.0
      - name: go test -race
        if: hashFiles('go.mod') != ''
        run: CGO_ENABLED=1 go test -race ./...
      - name: no cgo in aditctl
        if: hashFiles('go.mod') != ''
        run: CGO_ENABLED=0 go build ./...

  bench-schema:
    name: bench CSV schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        if: hashFiles('go.mod') != ''
        with:
          go-version-file: go.mod
          check-latest: true
      - name: schema check
        if: hashFiles('go.mod') != ''
        run: go run ./cmd/aditctl report --check bench/results
