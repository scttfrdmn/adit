[package]
name = "adit-py"
description = "Python binding over adit-client: GPU oracle, H-zero counters, and the client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "adit"
crate-type = ["cdylib"]

[features]
default = []
stub-api = ["adit-client/stub-api"]

[dependencies]
adit-client = { workspace = true }
adit-proto.workspace = true
pyo3.workspace = true
serde_json.workspace = true
hex.workspace = true
tokio.workspace = true
